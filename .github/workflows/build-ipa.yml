name: Build unsigned IPA

# Builds ios/ into an unsigned one-ip.ipa on a macOS runner and commits it
# back to ios/one-ip.ipa. Sign it with AltServer / AltStore (your Apple ID).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/OneIP/**"
      - "ios/OneIP.xcodeproj/**"
      - "ios/build-ipa.sh"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: bash ios/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-ip-ipa
          path: ios/build/one-ip.ipa
          if-no-files-found: error

      - name: Commit IPA back to repo
        run: |
          cp ios/build/one-ip.ipa ios/one-ip.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/one-ip.ipa
          if git diff --cached --quiet; then
            echo "IPA unchanged, nothing to commit."
          else
            git commit -m "构建未签名 IPA (ios/one-ip.ipa)"
            git push
          fi
